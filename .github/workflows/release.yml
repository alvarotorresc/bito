name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Build signed release
        env:
          BITO_KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          BITO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BITO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BITO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Extract changelog notes
        run: awk "/^## \\[?${GITHUB_REF_NAME#v}/{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      # mapping.txt viaja con el APK: sin él, un stack trace ofuscado que reporte
      # alguien no hay forma de leerlo, y R8 lo regenera distinto en cada build.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/notes.md
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          fail_on_unmatched_files: true
